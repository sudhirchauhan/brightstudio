<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Offline · Bright Studio</title><link rel='stylesheet' href='/studio/hub.css'><script defer src='/studio/hub/offline-local.js'></script></head><body><main id='main'><p class='eyebrow'>Bright Studio</p><h1>Offline</h1><div class="actions"><a href="/studio/hub/">Back to workspace</a><button id="offline-signout" type="button" class="secondary">Sign out</button></div><label>Project<select id='project'></select></label><section id='offline-page' aria-label='Offline copies'><p id='offline-status' role='status' aria-live='polite'></p><p>Copies stay on this device until you remove them. Signing out clears them. Remote revocation takes effect when you reconnect; server sync always checks access.</p><form id='offline-create'><fieldset id='offline-targets'><legend>Sources and documents to keep (up to five of each)</legend></fieldset><label><input id='offline-consent' type='checkbox' required> Keep these private copies on this device for up to seven days.</label><button id='offline-download'>Make offline copy</button></form><button id='offline-reload' type='button' class='secondary'>Reload copies</button><button id='offline-sync' type='button'>Sync saved drafts</button><button id='offline-clear' type='button' class='secondary'>Remove all local copies</button><div id='offline-copies'></div><section id='offline-editor' hidden><h2 id='offline-document-title'></h2><label>Document title<input id='offline-title' maxlength='200' required></label><div id='offline-blocks'></div><button id='offline-add' class='secondary' type='button'>Add text block</button><button id='offline-save-draft' type='button'>Save draft on this device</button><p id='offline-draft-status' role='status'></p></section></section></main></body></html>
