# Separate staging service. Do not apply this Blueprint to replace the main-linked development service.
services:
  - type: web
    name: brightstudio-m1-staging
    runtime: docker
    region: frankfurt
    plan: free
    branch: milestone-1
    autoDeploy: false
    dockerContext: ./erlang
    dockerfilePath: ./erlang/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: BRIGHT_ROLE
        value: web
      - key: STUDIO_HUB_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: BRIGHT_ORIGIN
        sync: false
