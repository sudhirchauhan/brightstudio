name: Erlang CI
on:
  push:
    branches: [main, 'feat/**', milestone-1, milestone-2, milestone-3]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [postgres, sqlite]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bright
          POSTGRES_PASSWORD: acceptance-only
          POSTGRES_DB: bright
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bright"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://bright:acceptance-only@127.0.0.1:5432/bright
      STUDIO_HUB_ENABLED: 'true'
      STUDIO_LIBRARY_ENABLED: 'true'
      STUDIO_EVIDENCE_ENABLED: 'true'
      STUDIO_STUDY_ENABLED: 'true'
      STUDIO_FOCUS_ENABLED: 'true'
      STUDIO_DOCUMENTS_ENABLED: 'true'
      STUDIO_AI_ENABLED: 'true'
      STUDIO_AUDIO_ENABLED: 'true'
      STUDIO_OFFLINE_ENABLED: 'true'
      STUDIO_WORKSPACE_ENABLED: 'true'
      BRIGHT_ORIGIN: http://127.0.0.1:10000
      BRIGHT_INSECURE_LOCAL_COOKIE: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: SQLite development backend
        if: matrix.backend == 'sqlite'
        run: echo "DATABASE_URL=sqlite:$GITHUB_WORKSPACE/erlang/_build/ci-development.sqlite" >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3.27'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: PDF extraction prerequisite
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr ffmpeg cmake
      - name: Verified local generation and speech models
        run: |
          python3 erlang/scripts/prepare-native-models.py --prefix "$GITHUB_WORKSPACE/erlang/_build/native-runtime"
          echo "BRIGHT_AI_EXECUTABLE=$GITHUB_WORKSPACE/erlang/_build/native-runtime/bin/llama-cli" >> "$GITHUB_ENV"
          echo "BRIGHT_AI_MODEL_PATH=$GITHUB_WORKSPACE/erlang/_build/native-runtime/models/assistant.gguf" >> "$GITHUB_ENV"
          echo "BRIGHT_WHISPER_EXECUTABLE=$GITHUB_WORKSPACE/erlang/_build/native-runtime/bin/whisper-cli" >> "$GITHUB_ENV"
          echo "BRIGHT_WHISPER_MODEL_PATH=$GITHUB_WORKSPACE/erlang/_build/native-runtime/models/whisper-tiny.en.bin" >> "$GITHUB_ENV"
          echo "BRIGHT_NATIVE_MODELS_TESTS=true" >> "$GITHUB_ENV"
      - name: Compile and integration tests
        working-directory: erlang
        run: rebar3 compile && BRIGHT_INTEGRATION_TESTS=true rebar3 eunit
      - name: Release and isolated acceptance accounts
        working-directory: erlang
        run: rebar3 as prod release && BRIGHT_ACCEPTANCE_SEED=true escript scripts/seed_acceptance.escript
      - name: Browser dependencies
        run: npm ci && npx playwright install --with-deps chromium
      - name: HTTP and browser acceptance
        run: |
          erlang/_build/prod/rel/bright_studio/bin/bright_studio foreground > /tmp/bright-release.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:10000/readyz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:10000/readyz
          BRIGHT_ROLE=worker VMARGS_PATH="$PWD/erlang/config/worker.vm.args" erlang/_build/prod/rel/bright_studio/bin/bright_studio foreground > /tmp/bright-worker.log 2>&1 &
          for attempt in $(seq 1 20); do
            if VMARGS_PATH="$PWD/erlang/config/worker.vm.args" erlang/_build/prod/rel/bright_studio/bin/bright_studio ping; then break; fi
            sleep 1
          done
          VMARGS_PATH="$PWD/erlang/config/worker.vm.args" erlang/_build/prod/rel/bright_studio/bin/bright_studio ping
          npm run test:e2e
      - name: Release restart, gates and dependency failure
        run: |
          erlang/_build/prod/rel/bright_studio/bin/bright_studio stop
          erlang/_build/prod/rel/bright_studio/bin/bright_studio foreground > /tmp/bright-release.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:10000/readyz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:10000/readyz
          node tests/release-checks.js && node tests/library-release-checks.js && node tests/evidence-release-checks.js && node tests/study-release-checks.js && node tests/workspace-release-checks.js && node tests/focus-release-checks.js && node tests/documents-release-checks.js
          VMARGS_PATH="$PWD/erlang/config/worker.vm.args" erlang/_build/prod/rel/bright_studio/bin/bright_studio stop
          node tests/remaining-release-checks.js
      - name: Password UI and session revocation (isolated fixture accounts)
        run: |
          erlang/_build/prod/rel/bright_studio/bin/bright_studio stop
          erlang/_build/prod/rel/bright_studio/bin/bright_studio foreground > /tmp/bright-release.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:10000/readyz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:10000/readyz
          node tests/account-password-ui.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: acceptance-failures-${{ matrix.backend }}
          path: |
            test-results/
            /tmp/bright-release.log
            /tmp/bright-worker.log
