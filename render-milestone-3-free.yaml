# Free staging only. Reuses the user's existing staging web service.
# Apply in Render dashboard with existing resources adopted, not create_new.
services:
  - type: web
    name: brightstudio-m1-staging
    runtime: docker
    region: frankfurt
    plan: free
    branch: milestone-3
    autoDeploy: false
    dockerContext: ./erlang
    dockerfilePath: ./erlang/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: BRIGHT_ROLE
        value: web
      - key: STUDIO_WEB_EXTRACTION_ENABLED
        value: "true"
      - key: STUDIO_HUB_ENABLED
        value: "false"
      - key: STUDIO_LIBRARY_ENABLED
        value: "false"
      - key: STUDIO_EVIDENCE_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: brightstudio-m3-staging-db
          property: connectionString
      - key: BRIGHT_ORIGIN
        value: https://brightstudio-m1-staging.onrender.com
databases:
  - name: brightstudio-m3-staging-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
