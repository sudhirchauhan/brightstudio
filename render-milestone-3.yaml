# Separate staging web, worker and private database. Never replace the main-linked service with this Blueprint.
services:
  - type: web
    name: brightstudio-m3-staging
    runtime: docker
    region: frankfurt
    plan: starter
    branch: milestone-3
    autoDeploy: false
    dockerContext: ./erlang
    dockerfilePath: ./erlang/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: BRIGHT_ROLE
        value: web
      - key: STUDIO_HUB_ENABLED
        value: "false"
      - key: STUDIO_LIBRARY_ENABLED
        value: "false"
      - key: STUDIO_EVIDENCE_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: brightstudio-m3-staging-db
          property: connectionString
      - key: BRIGHT_ORIGIN
        sync: false
  - type: worker
    name: brightstudio-m3-extraction-staging
    runtime: docker
    region: frankfurt
    plan: starter
    branch: milestone-3
    autoDeploy: false
    dockerContext: ./erlang
    dockerfilePath: ./erlang/Dockerfile
    envVars:
      - key: BRIGHT_ROLE
        value: worker
      - key: STUDIO_HUB_ENABLED
        value: "false"
      - key: STUDIO_LIBRARY_ENABLED
        value: "false"
      - key: STUDIO_EVIDENCE_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: brightstudio-m3-staging-db
          property: connectionString
databases:
  - name: brightstudio-m3-staging-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "17"
    ipAllowList: []
